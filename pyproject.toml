[project]
authors = [{name = "kolikaran"}]
description = ""
name = "voice-forge"
requires-python = ">=3.10,<3.15"
version = "0.1.0"

dependencies = [
  "dynaconf>=3.2.12,<4.0.0",
  "jinja2>=3.1.6,<4.0.0",
  "pytz>=2025.2,<2026.0",
  "pytest>=9.0.1,<10.0.0",
  "crongle @ git+https://github.com/kolikaran1992/crongle.git",
  "kagglehub>=0.3.13,<0.4.0",
  "librosa>=0.10.2",
  "phonemizer>=3.3.0",
  "tensorboard>=2.0,<3.0",
  "world4py>=0.1.1,<0.2.0",
  "unidecode>=1.4.0,<2.0.0",
  "pandas<=2.2.3",
  "huggingface-hub<1.0",
  "cython (>=3.2.2,<4.0.0)",
]

# [build-system]
# build-backend = "poetry.core.masonry.api"
# requires = ["poetry-core>=1.6.0", "setuptools>=61.0", "wheel", "Cython>=3.0"]

[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0"]

[dependency-groups]
non_ml_env = [
  "torch (>=2.8,<3.0) ; python_version >= '3.10' and python_version < '3.15'",
  "torchaudio (>=2.8,<3.0) ; python_version >= '3.10' and python_version < '3.15'",
  "torchvision (>=0.23,<1.0) ; python_version >= '3.10' and python_version < '3.15'",
  "numpy (>=2.0,<3.0) ; python_version >= '3.10' and python_version < '3.15'",
  "scikit-learn (>=1.6,<2.0) ; python_version >= '3.10' and python_version < '3.15'",
  "matplotlib (>=3.8,<4.0) ; python_version >= '3.10' and python_version < '3.15'",
  "scipy (==1.15) ; python_version >= '3.10' and python_version < '3.15'",
]
